{% extends 'index.html' %}

{% block title %}World of words main {% endblock %}

{% block profile %}
<div class="container">
    <div class="main-body">
        <div class="row gutters-sm">
            <div class="col-md-4 mb-3">
              
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-column align-items-center text-center">
                            <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Admin"
                                 class="rounded-circle" width="150">
                            <div class="mt-3">
                                <h4 class="username"></h4>
                                <p class="description mb-1">тут має бути опис користувача</p>
                                <a href="{% url 'create_post' pk=user.pk %}">
                                    <button type="button"
                                            class="btn btn-primary w-100 py-2 input secondary-btn">
                                        <font style="vertical-align: inherit;">
                                            <font style="vertical-align: inherit;">Створити пост</font></font></button>
                                </a>
                                <a id="logout" class="logout-btn btn btn-primary w-100 py-2 input primary-btn">Вийти</a>
                            </div>
                        </div>
                    </div>
                </div>
              
                <div class="card mt-3">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap">
                            <h6 class="mb-0">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                     stroke-linejoin="round" class="feather feather-globe mr-2 icon-inline">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                                Website
                            </h6>
                            <span class="text-secondary">https://bootdey.com</span>
                        </li>
                    </ul>
                </div>
            </div>
          
            <div class="main-profile col-md-8">
                <div class="card mb-3">
                    <div class="profile-info card-body"></div>
                </div>

                <div class="user-posts-container row gutters-sm"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
