{% extends 'index.html' %}

{% block title %}World of words main {% endblock %}

{% block profile %}
<div class="container">
    <div class="main-body">
        <div class="row gutters-sm">
            <div class="col-md-4 mb-3">
                <div class="card">

                    <div class="card-body">
                        <div class="d-flex flex-column align-items-center text-center">
                            
                            <div class="avatar-upload">
                                <input
                                    type="file"
                                    id="avatarInput"
                                    class="avatar-input"
                                    accept="image/*"
                                >
                                <label for="avatarInput" class="avatar-wrapper">
                                    <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="avatar"
                                     class="rounded-circle user-avatar" width="150">
                                
                                    <span class="avatar-overlay">
                                        <span class="avatar-text">Change photo</span>
                                    </span>
                                </label>
                            </div>
                                
                            <div class="mt-3 user_profile_card_info"></div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="main-profile col-md-8">
                <div class="card mb-3">
                    <div class="profile-info card-body"></div>
                </div>

                <div class="user-posts-container row gutters-sm"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
