{% extends 'index.html' %}

{% block title %}World of words main {% endblock %}

{% block profile %}
<div class="container">
    <div class="main-body">
        <div class="row gutters-sm">
            <div class="col-md-4 mb-3">
              
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-column align-items-center text-center">
                            <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Admin" class="rounded-circle" width="150">
                            <div class="mt-3">
                                <h4 class="username"></h4>
                                <a href="{% url 'create_post' pk=user.pk %}">
                                    <button type="button" class="btn btn-primary w-100 py-2 input secondary-btn">
                                        Створити пост
                                    </button>
                                </a>
                                <a id="logout" class="logout-btn btn btn-primary w-100 py-2 input primary-btn">Вийти</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          
            <div class="main-profile col-md-8">
                <div class="card mb-3">
                    <div class="profile-info card-body"></div>
                </div>

                <div class="user-posts-container row gutters-sm"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
