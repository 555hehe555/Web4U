{% extends 'index.html' %}

{% block title %}World of words main {% endblock %}

{% block profile %}
<div class="container">
    <div class="main-body">
        <div class="row gutters-sm">
            <div class="col-md-4 mb-3">
                <div class="card">

                    <div class="card-body">
                        <div id="preview-info" class="d-flex flex-column align-items-center text-center">
                            <!--                            <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="avatar"-->
                            <!--                                 class="rounded-circle" width="150">-->


                            <input class="button-img mt-2" type="file" name="img" accept="image/*"
                                   id="prev_input_img" style="display: none;" disabled>
                            <!--                            style="display: flex; flex-direction: column; align-items: flex-start;"-->
                            <label for="prev_input_img">
                                <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="avatar"
                                     class="rounded-circle" width="150">
                            </label>

                            <div class="mt-3">
                                <h4 id="prev_username_h" class="username user-data-row user-data-p"></h4>
                                <input id="prev_username_input user-data-row user-data-input" type="text"
                                       placeholder="">

                                <p id="prev_description_p" class="description user-data-row user-data-p">Добавте свій
                                    чарівний опис</p>
                                <input id="prev_description_input user-data-row user-data-input" type="text"
                                       class="form-control description-input"
                                       placeholder="">
                                <a href="{% url 'create_post' %}">
                                    <button type="button" class="btn btn-primary w-100 py-2 input secondary-btn">
                                        Створити пост
                                    </button>
                                </a>
                                <a id="logout" class="logout-btn btn btn-primary w-100 py-2 input primary-btn">Вийти</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="main-profile col-md-8">
                <div class="card mb-3">
                    <div class="profile-info card-body"></div>
                </div>

                <div class="user-posts-container row gutters-sm"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
